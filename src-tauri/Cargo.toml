[package]
name = "win11clip"
version = "0.7.6"
description = "A Windows 11-style Clipboard History Manager for Linux"
authors = ["harshp2008"]
license = "MIT"
homepage = "https://github.com/harshp2008/Win11Clip"
repository = "https://github.com/harshp2008/Win11Clip"
edition = "2021"
rust-version = "1.77"

[lib]
name = "win11clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "win11clip-bin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
# Tauri Core. Keep these on the same minor as the @tauri-apps/* packages in
# package.json: the Tauri CLI refuses to build when the two sides differ.
# Cargo.lock also holds tauri's internal crates (tauri-runtime, tauri-utils,
# tauri-macros, ...) at the 2.11-era versions; a bare `cargo update` pulls the
# 2.12 ones, which don't compile against tauri 2.11. Bump npm and Rust together.
tauri = { version = "~2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "~2.3.5"

# Clipboard Management - wayland-data-control for native Wayland support
arboard = { version = "3.4", features = ["image-data", "wayland-data-control"] }

# Async Runtime
tokio = { version = "1.52.2", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image Handling
image = "0.25.10"
base64 = "0.23"

# HTTP Client for GIF downloads
reqwest = { version = "0.13.3", features = ["blocking"] }

# Utilities
once_cell = "1.21.4"
parking_lot = "0.12"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "v5", "serde"] }
dirs = "6.0"

tauri-plugin-single-instance = "2.4.2"

# Global shortcut plugin for cross-platform hotkeys
tauri-plugin-global-shortcut = "~2.3.2"

# System information
whoami = "2.1.2"

# URL encoding for LXQt shortcuts
percent-encoding = "2.3"

# X11 Simulation for paste injection
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xtest"] }
libc = "0.2"
gtk = "0.18"
# D-Bus for XDG Desktop Portal (theme detection for COSMIC and other DEs)
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }
futures-lite = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
