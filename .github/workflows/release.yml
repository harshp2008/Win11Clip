name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Update version files
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          echo "Syncing version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
          sed -i '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          echo "=== Versions after sync ==="
          echo "package.json: $(grep '"version"' package.json | head -1)"
          echo "tauri.conf.json: $(grep '"version"' src-tauri/tauri.conf.json | head -1)"
          echo "Cargo.toml: $(grep '^version' src-tauri/Cargo.toml | head -1)"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
          body: |
            <div align="center">

            <img width="128" height="128" alt="logo" src="https://github.com/user-attachments/assets/4534e915-5d83-45f3-9f09-48a0f94b1d9a" />

            # Win11Clip ${{ github.ref_name }}

            ## 🚀 Quick Installation (Recommended)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/harshp2008/Win11Clip/master/scripts/install.sh | bash
            ```

            This script auto-detects your distro and architecture, then sets up everything including paste permissions.

            </div>

            ---

            ### 📦 Manual Installation

            <details>
            <summary>Ubuntu/Debian (.deb)</summary>

            Download the `.deb` from this release (amd64 for x86_64, arm64 for ARM64):
            ```bash
            sudo apt install ./win11clip_${{ steps.get_version.outputs.VERSION }}_amd64.deb
            sudo setfacl -m u:$USER:rw /dev/uinput
            ```
            </details>

            <details>
            <summary>Fedora/RHEL (.rpm)</summary>

            Download the `.rpm` from this release (x86_64 for Intel/AMD, aarch64 for ARM64):
            ```bash
            sudo dnf install ./win11clip-${{ steps.get_version.outputs.VERSION }}-1.x86_64.rpm
            sudo setfacl -m u:$USER:rw /dev/uinput
            ```
            </details>

            <details>
            <summary>Arch Linux</summary>

            The installer does not support Arch yet. The AUR package `win11-clipboard-history-bin` is the upstream project's, not this project's (this project's package is `win11clip`, see `aur/PKGBUILD`), and does not contain this project's fixes, so it is not recommended here. Use the AppImage below (some features are disabled) or build from source (see the [README](https://github.com/harshp2008/Win11Clip#readme)).
            </details>

            <details>
            <summary>AppImage (Universal - any distro)</summary>

            > ## Some features are disabled; we strongly recommend the complete installation.
            ```bash
            # Download the correct AppImage for your architecture
            chmod +x win11clip_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage
            sudo setfacl -m u:$USER:rw /dev/uinput  # Required for paste simulation
            ./win11clip_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage
            ```
            then register the command that you want in your system to open the AppImage
            ```
            KEYBOARD SETTINGS -> SHORTCUTS -> NEW SHORTCUT -> Super+V -> ./my_awesome_folder/win11clip_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage
            ```

            > **Note:** The `setfacl` command is temporary (resets on reboot). For permanent setup, see the [README](https://github.com/harshp2008/Win11Clip#readme).
            </details>

            <details>
            <summary>GNOME: spawn-at, and logging out after a manual install</summary>

            The packages above install the app only. On GNOME the popup is placed at your cursor by [spawn-at](https://github.com/harshp2008/spawn-at), **version 0.2.4 or newer**, together with its GNOME Shell extension and the two companion extensions (`win11-clipboard-bridge`, `window-calls`). The Quick Installation script sets all of them up. If you installed by hand, install spawn-at yourself and check its version:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/harshp2008/spawn-at/main/install.sh | bash
            spawn-at -V   # must print spawn-at 0.2.4 or newer
            ```
            **On Wayland, a newly installed or updated GNOME extension only loads after you log out and back in.** Do that once after installing or updating spawn-at or any of these extensions. With the Quick Installation script, a one-time check runs about 20 seconds after you log in and shows a notification: either "Win11Clip is ready", or which extension did not load (details in `~/.local/state/win11clip-installer/firstrun.log`). A manual install has no such check; see the [README](https://github.com/harshp2008/Win11Clip#-troubleshooting) to look at the extensions yourself.
            </details>

            ---

            ### ⌨️ Usage

            Press **Super+V** to open the clipboard history. The app will show a Setup Wizard on first run to configure shortcuts and permissions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AUR Package
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') }}
        continue-on-error: true
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY not set, skipping AUR update"
            exit 0
          fi

          VERSION=${{ steps.get_version.outputs.VERSION }}

          # Compute checksums for each architecture
          DEB_X86_64=$(find artifacts -name "*_amd64.deb" | head -1)
          DEB_ARM64=$(find artifacts -name "*_arm64.deb" | head -1)

          if [ -z "$DEB_X86_64" ]; then
            echo "x86_64 .deb not found, skipping AUR update"
            exit 0
          fi

          SHA256_X86_64=$(sha256sum "$DEB_X86_64" | cut -d' ' -f1)
          SHA256_ARM64=""
          if [ -n "$DEB_ARM64" ]; then
            SHA256_ARM64=$(sha256sum "$DEB_ARM64" | cut -d' ' -f1)
          fi

          echo "Updating AUR package to version $VERSION"
          echo "x86_64 checksum: $SHA256_X86_64"
          echo "arm64 checksum: ${SHA256_ARM64:-SKIP}"

          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            StrictHostKeyChecking no" > ~/.ssh/config

          # Clone AUR repo
          git clone ssh://aur@aur.archlinux.org/win11clip.git /tmp/aur-pkg
          cd /tmp/aur-pkg

          # Use aur/PKGBUILD from the repo as the single source of truth
          cp "$GITHUB_WORKSPACE/aur/PKGBUILD" PKGBUILD
          cp "$GITHUB_WORKSPACE/aur/win11clip.install" . 2>/dev/null || true

          # Update version and checksums via sed
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('$SHA256_X86_64')/" PKGBUILD
          if [ -n "$SHA256_ARM64" ]; then
            sed -i "s/sha256sums_aarch64=.*/sha256sums_aarch64=('$SHA256_ARM64')/" PKGBUILD
          else
            sed -i "s/sha256sums_aarch64=.*/sha256sums_aarch64=('SKIP')/" PKGBUILD
          fi

          # Generate .SRCINFO
          docker run --rm -v "$PWD:/pkg" archlinux bash -c "
            pacman -Sy --noconfirm pacman-contrib
            cd /pkg
            makepkg --printsrcinfo > .SRCINFO
          " || {
            echo "Docker failed, generating .SRCINFO manually"
            TAB=$'\t'
            cat > .SRCINFO << SRCINFO_EOF
          pkgbase = win11clip
          ${TAB}pkgdesc = Windows 11-style Clipboard History Manager for Linux
          ${TAB}pkgver = $VERSION
          ${TAB}pkgrel = 1
          ${TAB}url = https://github.com/harshp2008/Win11Clip
          ${TAB}install = win11clip.install
          ${TAB}arch = x86_64
          ${TAB}arch = aarch64
          ${TAB}license = MIT
          ${TAB}depends = webkit2gtk-4.1
          ${TAB}depends = gtk3
          ${TAB}depends = libayatana-appindicator
          ${TAB}depends = xclip
          ${TAB}depends = xdotool
          ${TAB}depends = wl-clipboard
          ${TAB}depends = acl
          ${TAB}depends = polkit
          ${TAB}optdepends = libappindicator-gtk3: Legacy tray icon support
          ${TAB}provides = win11-clipboard-history
          ${TAB}conflicts = win11-clipboard-history
          ${TAB}replaces = win11-clipboard-history
          ${TAB}options = !strip
          ${TAB}options = !debug
          ${TAB}source_x86_64 = https://github.com/harshp2008/Win11Clip/releases/download/v$VERSION/win11clip_${VERSION}_amd64.deb
          ${TAB}sha256sums_x86_64 = $SHA256_X86_64
          ${TAB}source_aarch64 = https://github.com/harshp2008/Win11Clip/releases/download/v$VERSION/win11clip_${VERSION}_arm64.deb
          ${TAB}sha256sums_aarch64 = ${SHA256_ARM64:-SKIP}

          pkgname = win11clip
          SRCINFO_EOF
            sed -i 's/^          //' .SRCINFO
          }

          # Commit and push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version $VERSION" || echo "No changes to commit"
          git push || echo "Push failed - may need manual intervention"
